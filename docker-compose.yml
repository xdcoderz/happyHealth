services:
  mqtt:
    image: eclipse-mosquitto:2.0
    volumes:
      - ./infrastructure/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    restart: unless-stopped

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      HAPPYHEALTH_ML_BASE_URL: http://ml-service:8000
      HAPPYHEALTH_MQTT_ENABLED: "true"
      HAPPYHEALTH_MQTT_BROKER_URL: tcp://mqtt:1883
    depends_on:
      - mqtt
      - ml-service
    ports:
      - "8080:8080"
    restart: unless-stopped

  simulator:
    build:
      context: ./simulator
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      PATIENT_ID: DEMO-001
      PUBLISH_INTERVAL_SECONDS: "5"
      STARTUP_DELAY_SECONDS: "20"
    depends_on:
      - mqtt
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped
